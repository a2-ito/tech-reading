name: auto-close

# validate が失敗した PR を自動クローズする。
#
# 安全設計:
#   - workflow_run で起動するため、PR のコードは一切 checkout せず実行しない。
#     信頼できないコードとこのジョブの書き込み権限が同じ実行環境に同居しない。
#   - 権限は pull-requests: write のみ。contents への書き込みは持たない。
#   - fork 由来 / 外部作者の PR は job の if と script 内で二重に除外する。
#   - keep-open ラベルが付いた PR は対象外とする（エスケープハッチ）。
on:
  workflow_run:
    workflows: ["validate"]
    types: [completed]

permissions:
  pull-requests: write

jobs:
  close:
    name: 検証に失敗した内部 PR をクローズする
    # 1 段目のガード: PR 起因 / 失敗 / 同一リポジトリのブランチであること。
    # head_repository がこのリポジトリ自身でない = fork からの PR なので走らせない。
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;

            // 信頼できる作者かどうか。フォーク不可・権限を持つ人のみ対象にする。
            const TRUSTED = ['OWNER', 'MEMBER', 'COLLABORATOR'];
            const KEEP_OPEN_LABEL = 'keep-open';

            const prs = run.pull_requests ?? [];
            if (prs.length === 0) {
              core.info('workflow_run に紐づく PR がありません。何もしません。');
              return;
            }

            for (const ref of prs) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: ref.number,
              });

              // 2 段目のガード: PR の実データを API から取り直して再検証する。
              // workflow_run のペイロードだけを信じない。
              const headRepo = pr.head.repo?.full_name;
              if (headRepo !== `${context.repo.owner}/${context.repo.repo}`) {
                core.notice(`#${pr.number}: fork (${headRepo}) からの PR のため対象外`);
                continue;
              }

              if (!TRUSTED.includes(pr.author_association)) {
                core.notice(`#${pr.number}: 外部作者 (${pr.author_association}) のため対象外`);
                continue;
              }

              if (pr.state !== 'open') {
                core.info(`#${pr.number}: 既に ${pr.state} のためスキップ`);
                continue;
              }

              if (pr.labels.some((l) => l.name === KEEP_OPEN_LABEL)) {
                core.notice(`#${pr.number}: ${KEEP_OPEN_LABEL} ラベルが付いているためクローズしません`);
                continue;
              }

              // 検証したコミットが PR の最新 HEAD でない場合、既に修正が push されている
              // 可能性があるためクローズしない。
              if (pr.head.sha !== run.head_sha) {
                core.notice(`#${pr.number}: 検証対象 ${run.head_sha.slice(0, 7)} は最新 HEAD ではないためスキップ`);
                continue;
              }

              const body = [
                '## 検証に失敗したため自動クローズしました',
                '',
                `\`validate\` ワークフローが失敗しました ([実行ログ](${run.html_url}))。`,
                '',
                'エントリの書式が README.md の規約を満たしていない可能性がありまっしゅ。',
                'ローカルで次のコマンドを実行すると、同じ検証を再現できまっしゅ。',
                '',
                '```bash',
                'python3 scripts/validate_entries.py',
                '```',
                '',
                `修正後にこの PR を reopen するか、新しい PR を作成してください。`,
                `自動クローズを止めたい場合は \`${KEEP_OPEN_LABEL}\` ラベルを付けてくださいっしゅ。`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });

              core.notice(`#${pr.number} をクローズしました`);
            }
